<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISM Directo | Pedidos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">ISM</span><div><b>ISM Directo</b><small>Pedidos a tu puerta</small></div></div>
    <nav>
      <button data-view="inicio">Inicio</button>
      <button data-view="catalogo">Productos</button>
      <button data-view="promociones">Promociones</button>
      <button data-view="pedidos">Mis pedidos</button>
    </nav>
    <button class="cart-btn" id="cartBtn">🛒 <span id="cartCount">0</span></button>
  </header>

  <main id="app"></main>

  <div class="modal hidden" id="modal">
    <div class="modal-card" id="modalContent"></div>
  </div>

  <footer>
    <div><b>ISM Directo</b><p>Compra productos de ISM de manera rápida y sencilla.</p></div>
    <div><b>Atención</b><p>Pedidos · Promociones · Seguimiento</p></div>
    <div><b>Importante</b><p>Prototipo académico. Los precios y productos son referenciales.</p></div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
